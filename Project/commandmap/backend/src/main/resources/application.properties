spring.application.name=commandmap
server.port=8080

# Comma separated list of origins allowed to call the API (the React dev server by default)
commandmap.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Scenarios are processed in memory only. Nothing is ever written to disk by the server.
commandmap.max-scenario-bytes=20971520

spring.jackson.deserialization.fail-on-unknown-properties=false
logging.level.com.commandmap=INFO
